name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Backend: Test + Build ──────────────────────────────────────────────
  backend-ci:
    name: Backend — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee-payroll-system

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: employee_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: employee_db_test
          DB_USER: postgres
          DB_PASSWORD: testpassword
          JWT_SECRET: test-secret-key-for-ci-only
        run: mvn test -B

      - name: Build JAR
        run: mvn package -DskipTests -B

  # ── 2. Frontend: Test + Build ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee-payroll-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: employee-payroll-frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: false

      - name: Build React app
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://pizzaco-backend.onrender.com
